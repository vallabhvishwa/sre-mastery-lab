name: SRE Lab Python CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sre-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m compileall -q python sre
      - name: Health check and log analyzer tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v
      - name: Basic log utility tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python -p 'test_*.py' -v
      - name: SLO calculator tests
        env:
          PYTHONPATH: sre
        run: python -m unittest discover -s sre -p 'test_*.py' -v
